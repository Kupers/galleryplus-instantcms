[description]
text[] = "Gallery+ 1.3.0 - stable gallery tile size, tag sorting, photo selection and lightbox on the tag search page, plus the site home page = gallery, a 'Copy description' button, a black photo-selection checkmark and a photo-editing error fix"
text[] = "Tag sorting under the gallery header: a '# tag sorting' field with existing-tag suggestions, chips of the selected tags and a '+' button to add the next tag; only photos matching any of the selected tags are shown, the filter works in 'Endless', 'Pages', 'Popular', 'Trends' and 'Favorites' modes and is kept while loading more and during pagination"
text[] = "Photo selection on the tag search page for an administrator or moderator: checkboxes appear on the cards and a 'Select all' / 'Delete' / 'Move to album' bar above the grid; actions run without reloading the page and the grid re-lays out"
text[] = "Lightbox on the tag search page: clicking a photo opens the viewer with navigation, likes and description, while clicking the name goes to the photo page - just like on the main gallery (previously a click went straight to the photo page)"
text[] = "Fixed pagination on the tag search page - all photos of the selected tag are now shown (previously only the first page was displayed)"
text[] = "Tag sorting without page reload: adding or removing a tag instantly hides the corresponding cards, the grid re-lays out and the address updates - the browser Back button works; compatible with endless scrolling and pagination"
text[] = "Tile layout: the column count is rounded instead of truncated - at the same window width the main and the inner gallery page produce tiles of the same size (previously a ~20 px width difference switched 4 columns to 3 and tiles stretched to 343 px instead of 260 px)"
text[] = "Layout is recalculated on page load and when the container width changes (ResizeObserver) - tile size no longer depends on when the browser shows the vertical scrollbar"
text[] = "Site home page = gallery: the 'Home page content' setting offers a 'Gallery+' item - when selected the site root opens the gallery (photo feed or albums, depending on the default mode)"
text[] = "Photo page: in the 'About' tab a 'Copy description' button appears under the description and copies the description text to the clipboard; enabled by the 'Show Copy description button' option on the 'View' tab (off by default)"
text[] = "Photo selection: the checkbox tick (border .galleryplus-checkbox::after) is now black instead of white - better contrast on the red selection mark"
text[] = "Fixed: moving a photo to another album from the edit window caused a PHP error (a call to the non-existent method updateAlbumPhotosCount instead of recalcAlbumPhotosCount) - the photo is now moved correctly"
text[] = "Controller events (home page, tag search, site search, comments, profile tabs) are registered on install and update - previously, on manual file upload, the rows had to be added to the cms_events table by hand"
text[] = "Fixed tag autocomplete on the upload page: suggestions appeared only for the first tag - now they work for the second and all following tags as well (the photo tags field and the new-album tags field)"

[install]
type = "component"
name = "galleryplus"