[description]
text[] = "Gallery+ 1.2.1 — paid features + per-album prices: paid photo upload, paid album viewing, paid original download"
text[] = "Upload: charges via billing addon actions (add_photo, view_album, download_original created during install), balance is checked before and during AJAX upload, insufficient balance redirects to deposit or returns JSON error"
text[] = "Albums: when a price is set, guests and non-buyers see only the first 3 photos; the rest become available after purchasing album access"
text[] = "Per-album price: with the 'Allow users to set their album price' option the owner sets their own viewing price; an empty price keeps the admin price from Billing, 0 makes the album free"
text[] = "Originals: full-size images (nocrop/original) are served through a serve-gate available to the owner, administrators and buyers; regular visitors get an access notification"
text[] = "Prices are managed in the Billing admin; setting a price to 0 restores the previous behavior"
text[] = "Paid options: the 'Site takes a commission' setting (checkbox + percent field); without a commission the author receives the full amount, with a commission the remainder is credited to the album/photo owner"

[install]
type = "component"
name = "galleryplus"