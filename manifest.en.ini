[author]
name = "Kuper"
url = "https://github.com/Kupers?tab=repositories"

[description]
text[] = "Gallery+ 1.4.1 - age gate: 18+ content is unavailable to minors"
text[] = "New option 'Hide 18+ blurred content from users under 18': if age is not confirmed (no birth date in profile or under 18) 18+ cards are fully hidden and the blur is never removed anywhere: gallery, albums, favorites, tags, 'Similar photos', widgets"
text[] = "Instead of viewing 18+ content, a user under 18 or without a birth date gets a warning prompting them to set a birth date in their profile; administrators and moderators are exempt"
text[] = "Gallery+ 1.4.1 - fix: photos from adult (18+) albums are no longer shown without a blur - on the tags pages and in the 'Similar photos' block"
text[] = "Fix: the tags page no longer shows photos from adult albums without a blur - they now appear blurred with an 18+ badge, like in the gallery and albums"
text[] = "Fix: in the 'Similar photos' block on the photo page, photos from adult albums are now shown blurred (previously could be shown without blur), and inaccessible private albums are excluded from similar photos"
text[] = "Gallery+ 1.4.0 - album filter, bulk tag assignment and fixes"
text[] = "Album filter on the gallery page: search albums by title or author with autocomplete, only photos of the selected albums are shown, filter reset"
text[] = "Bulk tag assignment: the selection bar on the album page now has a 'Tags' button to add tags to several selected photos at once"
text[] = "Fix: on mobile the 'Download' button on the photo page no longer overflows the screen"
text[] = "Fix: updating the component no longer resets controller settings to defaults"

[install]
type = "component"
name = "galleryplus"
