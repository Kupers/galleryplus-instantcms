[description]
text[] = "Gallery+ 1.5.0 — секретные ссылки на альбомы и отдельные фото: ссылка открывает доступ по прямой ссылке без пароля и настроек приватности (кроме платных альбомов — они по-прежнему требуют оплаты)"
text[] = "Панель «Секретная ссылка»: создать, скопировать, отозвать, включить, перевыпустить, удалить; срок действия (от 1 до 30 дней или бессрочно), лимит по числу устройств (автоматическая привязка к устройству; 1 = привязка к одному устройству), одноразовый просмотр (ссылка закрывается после первого перехода)"
text[] = "Предпросмотр ссылки в мессенджерах: показывается фото-карточка (og:image); авто-запросы мессенджеров (MAX/VK, Telegram, Nextcloud и др.) больше не расходуют лимит ссылки — не занимают устройство и не закрывают одноразовый просмотр. Опция «Скрыть предпросмотр в мессенджерах» при создании ссылки; кнопка «Секретная ссылка» оформлена иконкой ссылки"
text[] = "Gallery+ 1.4.2 — сортировка фото в альбоме: добавлен переключатель «Сначала новые» / «Сначала старые» — пользователь сам выбирает порядок отображения фотографий в альбоме (по умолчанию — сначала старые); работает и при бесконечной подгрузке"
text[] = "Исправление: блюр карточек 18+ и платных фото на странице фотографии больше не выходит за рамки изображения и не перекрывает «хлебные крошки» и контент ниже — размытие обрезается по границам фото"
text[] = "Gallery+ 1.4.2 — уведомления администраторам о новых версиях через «колокольчик» в админке"
text[] = "Исправление: проверка наличия обновлений теперь выполняется на каждой странице админ-панели (хук adminpanel_menu), а уведомление о новой версии приходит стандартным системным уведомлением ICMS (счётчик на «колокольчике» + список уведомлений), а не невидимым личным сообщением"
text[] = "Исправление: таблица galleryplus_updates автоматически создаётся при обновлении компонента — проверка обновлений больше не «тихо» не работает"
text[] = "Gallery+ 1.4.1 — возрастной гейт: контент 18+ недоступен несовершеннолетним"
text[] = "Новая опция «Не показывать 18+ под блюром пользователям младше 18»: при неподтверждённом возрасте (нет даты рождения в профиле или меньше 18) карточки 18+ полностью скрываются, а блюр не снимается нигде: галерея, альбомы, избранное, теги, «Похожие фото», виджеты"
text[] = "Вместо просмотра 18+ пользователю младше 18 или без даты рождения показывается предупреждение с предложением указать дату рождения в профиле; администраторы и модераторы — исключение"
text[] = "Исправление: фотографии из взрослых (18+) альбомов больше не показываются без блюра — на страницах тегов и в блоке «Похожие фото»"
text[] = "Исправление: страница тегов больше не показывает фото из взрослых альбомов без блюра — теперь они отображаются с блюром и меткой 18+, как в галерее и в альбомах"
text[] = "Исправление: в блоке «Похожие фото» на странице фотографии фото из взрослых альбомов показываются с блюром (раньше могли отдаваться без него), а недоступные приватные альбомы из похожих исключены"
text[] = "Gallery+ 1.4.0 — фильтр по альбомам, массовое назначение тегов и исправления"
text[] = "Фильтр по альбомам на странице галереи: поиск по названию или автору с автоподсказками, показываются только фото выбранных альбомов, сброс фильтра"
text[] = "Массовое назначение тегов: в панели выбора на странице альбома появилась кнопка «Теги» — можно добавить теги сразу нескольким выбранным фотографиям"
text[] = "Исправление: на мобильных кнопка «Скачать» на странице фото больше не выходит за границы экрана"
text[] = "Исправление: при обновлении компонента настройки контроллера больше не сбрасываются на значения по умолчанию"

[install]
type = "component"
name = "galleryplus"
