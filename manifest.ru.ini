[description]
text[] = "Gallery+ 1.2.4 — системный поиск по фото, заголовок на странице фото + платные фишки и пер-альбомные цены"
text[] = "Системный поиск: фото галереи участвуют в общем поиске ICMS — находятся по названию файла и описанию; источник «Галерея» включается в настройках поиска; в выдачу попадают только опубликованные фото из публичных бесплатных альбомов"
text[] = "Загрузка: проверка и списание средств за загрузку фото (аддон-действия add_photo, view_album, download_original создаются при установке), при нехватке баланса — редирект на пополнение или JSON-ошибка для AJAX"
text[] = "Альбомы: при включённом прайсе гостям и не купившим доступ показываются только первые 3 фото, остальные — после покупки доступа к альбому"
text[] = "Пер-альбомная цена: с опцией «Разрешить пользователям назначать цену на свои альбомы» владелец задаёт свою цену просмотра; пустая цена — цена админа из Биллинга, 0 — бесплатный просмотр"
text[] = "Оригиналы: полноразмерные фото (nocrop/original) отдаются через serve-гейт и доступны владельцу, администраторам и купившим доступ; обычные посетители получают нотификацию об ограничении"
text[] = "Цены настраиваются в админке Биллинга; отключение (цена 0) возвращает прежнее поведение"
text[] = "Платные опции: настройка «Сайт берёт процент с продаж» (чекбокс + поле процента); без комиссии автор получает всю сумму продажи, с комиссией остаток зачисляется владельцу альбома/фото"
text[] = "Лайтбокс: длинное описание фото сокращается (по умолчанию до 300 символов) с кнопкой «Показать полностью»; настройки: «Сокращать описание в лайтбоксе» и «Лимит символов описания»"
text[] = "Виджет-карта: в попапе маркера показывается миниатюра с описанием фото и кнопкой «Подробнее» на страницу фото; настройки: «Показывать описание в попапе» и «Лимит символов описания»"

[install]
type = "component"
name = "galleryplus"