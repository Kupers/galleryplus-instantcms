[description]
text[] = "Gallery+ 1.3.0 — стабильный размер карточек галереи, сортировка по тегам, выбор фото и лайтбокс на странице поиска по тегу, а также главная страница сайта = галерея, кнопка «Копировать описание», чёрная галочка выбора фото и исправление ошибки редактирования фото"
text[] = "Сортировка по тегам под заголовком галереи: поле «# сортировка по тегам» с подсказками существующих тегов, чипы выбранных тегов и кнопка «+» для добавления следующего тега; показываются только фото с выбранными тегами (любой из выбранных тегов), фильтр работает в режимах «Бесконечная», «Страницы», «Популярное», «Тренды» и «Любимое», сохраняется при догрузке и пагинации"
text[] = "Выбор фото на странице поиска по тегу для администратора и модератора: на карточках появляются чекбоксы, над сеткой — «Выделить все», «Удалить» и «Переместить в альбом»; действия выполняются без перезагрузки страницы, сетка перестраивается"
text[] = "Лайтбокс на странице поиска по тегу: клик по фото открывает просмотрщик с навигацией, лайками и описанием, клик по названию ведёт на страницу фото — так же, как на главной галерее (раньше клик сразу переходил на страницу фото)"
text[] = "Исправлена постраничная навигация на странице поиска по тегу — теперь видны все фото выбранного тега (раньше показывалась только первая страница)"
text[] = "Сортировка по тегам работает без перезагрузки страницы: при добавлении или снятии тега карточки мгновенно исчезают, сетка перестраивается, а адрес обновляется — работает кнопка «назад» браузера; совместимо с бесконечной прокруткой и постраничной навигацией"
text[] = "Раскладка карточек: число колонок считается по округлению, а не отбрасыванием дробной части — при одинаковой ширине окна главная и внутренняя страница галереи дают одинаковый размер плиток (раньше разница в ширине около 20 px переключала 4 колонки на 3, и плитки растягивались до 343 px вместо 260 px)"
text[] = "Пересчёт раскладки при загрузке страницы и при изменении ширины контейнера (ResizeObserver) — размер карточек больше не зависит от того, когда браузер показал вертикальную прокрутку"
text[] = "Главная страница сайта = галерея: в настройках «Содержимое главной страницы» появляется пункт «Gallery+» — при выборе корень сайта открывает галерею (лента фото или альбомы, в зависимости от режима по умолчанию)"
text[] = "Страница фото: во вкладке «О фото» под описанием появляется кнопка «Копировать описание» — копирует текст описания в буфер обмена; включается настройкой «Показывать кнопку Копировать описание» на вкладке «Вид» (по умолчанию выключена)"
text[] = "Выбор фото: галочка чекбокса (border .galleryplus-checkbox::after) чёрного цвета вместо белого — контрастный вид на красной отметке выбора"
text[] = "Исправлено: при переносе фото в другой альбом через окно редактирования возникала ошибка PHP (вызов несуществующего метода updateAlbumPhotosCount вместо recalcAlbumPhotosCount) — фото теперь переносится корректно"
text[] = "События контроллера (главная страница, поиск по тегам, системный поиск, комментарии, вкладки профиля) регистрируются при установке и обновлении пакета — раньше при ручной заливке файлов их нужно было добавлять в таблицу cms_events вручную"
text[] = "Исправлен автокомплит тегов на странице загрузки: подсказки появлялись только для первого тега — теперь они работают и для второго, и для последующих тегов (поле ввода тегов фото и тегов нового альбома)"

[install]
type = "component"
name = "galleryplus"